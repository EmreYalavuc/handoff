<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <!-- TeamViewer / Mat Mavi Gradyanı -->
    <linearGradient id="handoffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244C70" />
      <stop offset="100%" stop-color="#4F83B8" />
    </linearGradient>
  </defs>

  <!-- İkon: İki cihaz/ekran arasındaki transferi temsil eden akıllı ok/el değiştirmesi -->
  <g transform="translate(10, 10)">
    <!-- Arka Ekran (Kaynak) -->
    <rect x="0" y="4" width="22" height="16" rx="3" fill="#EAF2F9" stroke="#244C70" stroke-width="2"/>
    <path d="M7 24h8" stroke="#244C70" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Ön Ekran (Hedef / Devralınan) -->
    <rect x="18" y="12" width="22" height="16" rx="3" fill="url(#handoffGrad)" stroke="#244C70" stroke-width="1.5"/>
    <path d="M25 32h8" stroke="#4F83B8" stroke-width="2" stroke-linecap="round"/>

    <!-- Bağlantı / Transfer Akış Simgesi (Handoff Hissi) -->
    <path d="M14 12c4 0 8 4 10 4" fill="none" stroke="#4F83B8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
  </g>

  <!-- Tipografi: Handoff -->
  <text x="65" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" letter-spacing="-0.5">
    hand<tspan fill="#4F83B8">off</tspan>
  </text>
  
  <!-- Küçük Kurumsal Nokta Detayı -->
  <circle cx="168" cy="33" r="3.5" fill="#4F83B8" />
</svg>
